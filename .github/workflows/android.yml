name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download optional NIMA models
        env:
          NIMA_AESTHETIC_URL: ${{ vars.NIMA_AESTHETIC_URL }}
          NIMA_TECHNICAL_URL: ${{ vars.NIMA_TECHNICAL_URL }}
        run: |
          mkdir -p app/src/main/assets
          if [ -n "$NIMA_AESTHETIC_URL" ] && [ -n "$NIMA_TECHNICAL_URL" ]; then
            curl -fL --retry 3 "$NIMA_AESTHETIC_URL" -o app/src/main/assets/nima_aesthetic_fp16.tflite
            curl -fL --retry 3 "$NIMA_TECHNICAL_URL" -o app/src/main/assets/nima_technical_fp16.tflite
            test "$(wc -c < app/src/main/assets/nima_aesthetic_fp16.tflite)" -gt 100000
            test "$(wc -c < app/src/main/assets/nima_technical_fp16.tflite)" -gt 100000
          else
            echo "NIMA URLs not configured; APK builds without NIMA weights and reports missing-model errors."
          fi
      - name: Build llama.cpp Android ARM64 multimodal server
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          cmake -S /tmp/llama.cpp -B /tmp/llama-android \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/$(ls "$ANDROID_HOME/ndk" | sort -V | tail -1)/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=ON -DGGML_OPENMP=OFF -DBUILD_SHARED_LIBS=OFF
          cmake --build /tmp/llama-android --config Release --target llama-server -j 4
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp /tmp/llama-android/bin/llama-server app/src/main/jniLibs/arm64-v8a/libsmolvlm-server.so
      - name: Unit tests and debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameCritic-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
