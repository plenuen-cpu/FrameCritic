name: FrameCritic Offline APK
on:
  push:
    branches: [rebuild/offline-v2]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: framecritic-offline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;28.2.13676358'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/cache@v4
        with:
          path: app/src/main/assets/models
          key: models-${{ hashFiles('app/src/main/assets/models/manifest.json') }}
      - name: Embed verified models and licenses
        run: |
          python scripts/fetch_models.py
          python scripts/fetch_licenses.py
      - name: Build Android ARM64 runtime
        run: bash scripts/prepare_runtime.sh android
      - name: Build and unit test Android app
        run: |
          gradle --no-daemon --stacktrace wrapper --gradle-version 8.9
          gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Verify signature alignment and embedded models
        run: |
          mkdir -p verification
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk > verification/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 app/build/outputs/apk/debug/app-debug.apk > verification/alignment.txt
          python scripts/verify_apk.py
          cp app/build/outputs/apk/debug/app-debug.apk FrameCritic-2.0.0-arm64.apk
          zip -q -r FrameCritic-2.0.0-source-with-models.zip app/src app/build.gradle.kts build.gradle.kts settings.gradle.kts gradle.properties gradlew gradlew.bat gradle scripts docs README.md .github .gitignore
      - uses: actions/upload-artifact@v4
        with:
          name: FrameCritic-Android
          path: |
            FrameCritic-2.0.0-arm64.apk
            FrameCritic-2.0.0-source-with-models.zip
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-verification
          path: |
            verification/
            app/build/reports/
            app/build/outputs/apk/androidTest/
  inference:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: app/src/main/assets/models
          key: models-${{ hashFiles('app/src/main/assets/models/manifest.json') }}
      - run: python scripts/fetch_models.py
      - run: bash scripts/prepare_runtime.sh host
      - run: pip install ai-edge-litert==1.4.0 numpy==1.26.4 pillow==11.1.0 jsonschema==4.23.0
      - name: Real NIMA and multimodal and Korean inference
        run: python scripts/smoke_inference.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Inference-verification
          path: verification/
  deliver:
    needs: [android, inference]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: FrameCritic-Android
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: Inference-verification
          path: release/inference
      - uses: actions/download-artifact@v4
        with:
          name: Android-verification
          path: release/android-verification
      - run: cd release && zip -qr FrameCritic-verification.zip inference android-verification
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: offline-v2-${{ github.run_number }}
          name: FrameCritic 2.0 Offline · build ${{ github.run_number }}
          prerelease: true
          body_path: docs/RELEASE_NOTES.md
          files: |
            release/FrameCritic-2.0.0-arm64.apk
            release/FrameCritic-2.0.0-source-with-models.zip
            release/FrameCritic-verification.zip
