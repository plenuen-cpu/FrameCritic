name: Pin verified release source
on:
  push:
    branches: [rebuild/release-metadata]
permissions:
  contents: write
  actions: read
jobs:
  pin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify built application and pin its release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/plenuen-cpu/FrameCritic/actions/runs/43110646478 --jq .conclusion)" = success
          test "$(git rev-parse HEAD^)" = 10c21f1ca44817a696c625316c1b0170dc45a4de
          git diff --exit-code HEAD^ HEAD -- app scripts docs README.md build.gradle.kts settings.gradle.kts gradle.properties
          git push --force-with-lease=refs/tags/offline-v2-53:ea66e64905e5e659843b9bf20f9fe08bd078e8ea origin "$GITHUB_SHA:refs/tags/offline-v2-53"
          release_id=$(gh api repos/plenuen-cpu/FrameCritic/releases/tags/offline-v2-53 --jq .id)
          gh api --method PATCH "repos/plenuen-cpu/FrameCritic/releases/$release_id" -f target_commitish="$GITHUB_SHA" --silent
